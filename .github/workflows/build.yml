name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build EpochTray.sln -c Release
      - name: Run conversion regression suite
        run: dotnet run --project tests/EpochTray.Tests -c Release --no-build
      - name: Publish portable Windows x64 app
        run: dotnet publish src/EpochTray/EpochTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64
      - name: Publish portable Windows ARM64 app
        run: dotnet publish src/EpochTray/EpochTray.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: EpochTray-windows-x64
          path: artifacts/win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: EpochTray-windows-arm64
          path: artifacts/win-arm64/
